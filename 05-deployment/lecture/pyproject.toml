[project]
name = "lecture"
version = "0.1.0"
description = "Churn prediction service"
readme = "README.md"
authors = [
    { name = "Devaang20", email = "devaang201@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.159.1",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
lecture = "lecture:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "requests>=2.34.2",
]
